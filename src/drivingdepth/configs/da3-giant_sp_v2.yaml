# da3-giant_sp with cross_attn_blocks_v2 (adjacency-constrained cross-view + cross-frame attention)
# i.e. the vitg_sp backbone with cross_attn_version: v2
__object__:
  path: drivingdepth.model.da3
  name: DepthAnything3Net
  args: as_params

net:
  __object__:
    path: drivingdepth.model.dinov2.dinov2
    name: DinoV2
    args: as_params

  name: vitg_sp
  out_layers: [19, 27, 33, 39]
  alt_start: 13
  qknorm_start: 13
  rope_start: 13
  cat_token: True
  with_sp_depth: True
  cross_attn_version: v2

head:
  __object__:
    path: drivingdepth.model.dualdpt
    name: DualDPT
    args: as_params

  dim_in: &head_dim_in 3072
  output_dim: 2
  features: &head_features 256
  out_channels: &head_out_channels [256, 512, 1024, 1024]


cam_enc:
  __object__:
    path: drivingdepth.model.cam_enc
    name: CameraEnc
    args: as_params

  dim_out: 1536
